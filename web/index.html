<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Путешественник — Солнечная система на шаттле</title>
<meta name="description" content="Летай на шаттле по Солнечной системе: настоящие расстояния, подробные планеты по картам NASA, планеты на сегодняшних местах.">
<meta name="theme-color" content="#04050c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="heatfx" id="heatfx"></div>
<div class="flash" id="flash"></div>
<div class="alert" id="alert" hidden><b id="alertH"></b><span id="alertP"></span></div>
<div id="labels"></div>

<div class="hud" id="hud" hidden>
  <div class="h-row">
    <div class="h-stat"><span data-i18n="speed"></span><b id="hSpeed">—</b></div>
    <div class="h-stat"><span id="hNearK"></span><b id="hAlt">—</b></div>
    <div class="h-stat hot" id="hHullS" hidden><span data-i18n="hull"></span><b id="hHull">—</b></div>
    <div class="h-stat slow" id="hTimeS" hidden><span data-i18n="hourHere"></span><b id="hTime">—</b></div>
    <div class="h-stat slow" id="hEarthS" hidden><span data-i18n="earthPassed"></span><b id="hEarth">—</b></div>
  </div>
  <div class="h-auto" id="hAuto" hidden><span id="hAutoT"></span> <button type="button" id="hAutoX" data-i18n="cancel"></button></div>
</div>
<div class="langs" id="langs"></div>
<a class="home" id="home" href="https://cosmos.tomerisr.org.il/" data-i18n="toMain"></a>
<div class="warp" id="warp" hidden><b id="warpT"></b></div>
<div class="toast" id="toast" hidden></div>

<div class="ctl" id="ctl" hidden>
  <button type="button" class="btn" id="bWhere" data-i18n="where"></button>
  <button type="button" class="btn ghost" id="bAim"></button>
  <button type="button" class="btn ghost" id="bStop" data-i18n="stop"></button>
</div>
<div class="throttle" id="throttle" hidden>
  <button type="button" class="tbtn" id="bGas"><i>▲</i><span data-i18n="gas"></span></button>
  <div class="th-track" id="thTrack"><i id="thFill"></i><b id="thKnob"></b></div>
  <button type="button" class="tbtn" id="bBrake"><i>▼</i><span data-i18n="brake"></span></button>
</div>
<div class="stick" id="stick" hidden><i id="stickKnob"></i></div>

<div class="card" id="card" hidden>
  <h2 id="cName"></h2>
  <dl id="cFacts"></dl>
  <p id="cFact"></p>
</div>

<div class="menu" id="menu" hidden>
  <div class="menu-in">
    <h2 data-i18n="where"></h2>
    <div class="menu-list" id="menuList"></div>
  </div>
</div>

<div class="dead" id="dead" hidden>
  <div class="intro-in">
    <h1 data-i18n="deadH"></h1>
    <p id="deadP"></p>
    <button type="button" class="btn" id="bRespawn" data-i18n="respawn"></button>
  </div>
</div>

<div class="intro" id="intro">
  <div class="intro-in">
    <h1 data-i18n="introH"></h1>
    <p data-i18n="introP"></p>
    <p class="how" id="introHow"></p>
    <p class="how" data-i18n="introAuto"></p>
    <button type="button" class="btn" id="bGo" data-i18n="go"></button>
    <a class="intro-home" href="https://cosmos.tomerisr.org.il/" data-i18n="toMainIntro" onclick="this.href=document.getElementById('home').href"></a>
    <p class="credits" data-i18n="credits"></p>
  </div>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
